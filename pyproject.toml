[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finaudit_env"
version = "0.1.0"
description = "Reproducible RL environment and evaluator for financial audit models"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic==2.9.2",
    "pytest==8.3.3",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["judge_adapter"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["finaudit_env*"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "-q"
